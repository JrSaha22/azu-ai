
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0ff">
<title>AZU AI - Your AI Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#f8f6fc;
 color:#29243a;
 height:100dvh;
 display:flex;
 flex-direction:column;
}
header{
 padding:19px 18px;
 background:#fff;
 border-bottom:1px solid #eee8f5;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:11px}
.orb{
 width:43px;height:43px;border-radius:15px;
 background:linear-gradient(135deg,#c5a8ff,#91caff);
 display:grid;place-items:center;
 color:white;font-size:24px;
}
.logo h2{font-size:21px;letter-spacing:1px}
.logo p{font-size:11px;color:#999;margin-top:3px}
.status{font-size:11px;color:#8172aa}
main{
 flex:1;overflow-y:auto;
 padding:25px 18px 15px;
}
.welcome{text-align:center;margin:45px 0 30px}
.welcome .big{
 width:75px;height:75px;margin:auto;
 border-radius:25px;
 background:linear-gradient(135deg,#d9c6ff,#b6dcff);
 display:grid;place-items:center;
 font-size:37px;color:white;
}
.welcome h1{font-size:27px;margin:20px 0 9px}
.welcome p{color:#888;font-size:14px;line-height:1.6}
.suggestions{
 display:grid;grid-template-columns:1fr 1fr;
 gap:11px;margin-top:25px;
}
.suggestion{
 background:white;border:1px solid #eee7f7;
 border-radius:16px;padding:16px;
 font-size:13px;color:#65567e;
 cursor:pointer;
}
.suggestion span{display:block;font-size:21px;margin-bottom:9px}
#chat{display:flex;flex-direction:column;gap:17px}
.msg{
 max-width:88%;padding:14px 16px;
 border-radius:17px;font-size:14px;
 line-height:1.6;white-space:pre-wrap;
}
.user{align-self:flex-end;background:#e9ddff}
.bot{align-self:flex-start;background:white;border:1px solid #eee7f7}
.bottom{padding:12px 15px 20px;background:#f8f6fc}
.inputbox{
 display:flex;gap:9px;background:white;
 padding:9px;border:1px solid #e8e0f2;
 border-radius:19px;align-items:center;
}
input{
 flex:1;min-width:0;border:0;outline:0;
 padding:10px;font-size:14px;
 background:transparent;color:#29243a;
}
button{
 border:0;cursor:pointer;
 background:linear-gradient(135deg,#b99aff,#91caff);
 color:white;border-radius:13px;
 padding:12px 16px;font-size:16px;
}
.note{text-align:center;color:#aaa;font-size:10px;margin-top:10px}
</style>
</head>

<body>
<header>
 <div class="logo">
  <div class="orb">✦</div>
  <div>
   <h2>AZU AI</h2>
   <p>Your intelligent companion</p>
  </div>
 </div>
 <div class="status">● Ready to chat</div>
</header>

<main id="main">
 <div class="welcome" id="welcome">
  <div class="big">✦</div>
  <h1>Hello, Welcome!</h1>
  <p>I'm AZU AI. Your ideas, questions<br>and creativity start here.</p>

  <div class="suggestions">
   <div class="suggestion" onclick="suggest('Help me learn programming')">
    <span>💻</span>Learn coding
   </div>
   <div class="suggestion" onclick="suggest('Give me creative ideas')">
    <span>💡</span>Creative ideas
   </div>
   <div class="suggestion" onclick="suggest('Explain artificial intelligence')">
    <span>🧠</span>Explore AI
   </div>
   <div class="suggestion" onclick="suggest('Help me with my studies')">
    <span>📚</span>Study assistant
   </div>
  </div>
 </div>
 <div id="chat"></div>
</main>

<div class="bottom">
 <div class="inputbox">
  <input id="message" placeholder="Ask AZU anything..." 
   onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">➤</button>
 </div>
 <div class="note">AZU AI • Built with curiosity and creativity</div>
</div>

<script>
function suggest(text){
 document.getElementById('message').value=text;
 send();
}

function send(){
 const input=document.getElementById('message');
 const text=input.value.trim();
 if(!text)return;

 document.getElementById('welcome').style.display='none';
 const chat=document.getElementById('chat');

 const user=document.createElement('div');
 user.className='msg user';
 user.textContent=text;
 chat.appendChild(user);

 const bot=document.createElement('div');
 bot.className='msg bot';
 bot.textContent='Welcome to AZU AI! ✨ Your chat interface is working. Our next step is connecting a real AI model so I can answer your questions intelligently.';
 chat.appendChild(bot);

 input.value='';
 document.getElementById('main').scrollTop=
 document.getElementById('main').scrollHeight;
}
</script>
</body>
    </html>
